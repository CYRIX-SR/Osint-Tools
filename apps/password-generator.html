<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Password Forge</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">LOCAL SECURITY UTILITY</div><h1>Password Forge</h1><p class="desc">Generate strong random passwords entirely inside your browser.</p><div class="row"><div><label>Length</label><input id="len" type="number" value="20" min="6" max="128"></div><div><label>Character set</label><select id="mode"><option value="all">Letters + numbers + symbols</option><option value="letters">Letters + numbers</option><option value="simple">Letters only</option></select></div></div><div class="actions"><button onclick="gen()">Generate</button><button class="alt" onclick="copy()">Copy</button></div><div id="out" class="output"></div></div></main><script>function gen(){let n=+len.value,s={all:"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+=?",letters:"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789",simple:"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"}[mode.value],a=new Uint32Array(n);crypto.getRandomValues(a);out.textContent=[...a].map(x=>s[x%s.length]).join("")}function copy(){navigator.clipboard.writeText(out.textContent)}gen();</script></body></html>
