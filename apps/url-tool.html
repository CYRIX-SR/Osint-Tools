<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>URL Inspector</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">WEB UTILITY</div><h1>URL Inspector</h1><p class="desc">Parse a URL into useful components without making a network request.</p><label>URL</label><input id="input" value="https://example.com:443/docs/page?q=hello#top"><div class="actions"><button onclick="inspect()">Inspect</button></div><div id="out" class="result-grid"></div></div></main><script>function inspect(){try{let u=new URL(input.value),a={protocol:u.protocol,host:u.host,hostname:u.hostname,port:u.port||"(default)",pathname:u.pathname,query:u.search||"(none)",hash:u.hash||"(none)"};out.innerHTML=Object.entries(a).map(([k,v])=>`<div class="result"><small>${k}</small><strong>${v}</strong></div>`).join("")}catch(e){out.textContent="Invalid URL"}}inspect();</script></body></html>
