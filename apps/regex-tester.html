<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Regex Tester</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">DEVELOPER UTILITY</div><h1>Regex Tester</h1><p class="desc">Test JavaScript regular expressions against sample text.</p><div class="row"><div><label>Pattern</label><input id="pattern" placeholder="\\b[A-Z]\\w+"></div><div><label>Flags</label><input id="flags" value="g"></div></div><label>Test text</label><textarea id="text" rows="9"></textarea><div class="actions"><button onclick="test()">Test</button></div><div id="out" class="output"></div></div></main><script>function test(){try{let r=new RegExp(pattern.value,flags.value),m=[...text.value.matchAll(r)];out.textContent=m.length?m.map((x,i)=>`${i+1}. ${x[0]} @ ${x.index}`).join("\n"):"No matches"}catch(e){out.textContent=e.message}}</script></body></html>
