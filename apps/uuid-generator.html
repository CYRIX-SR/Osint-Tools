<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>UUID Forge</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">IDENTIFIER UTILITY</div><h1>UUID Forge</h1><p class="desc">Generate UUID v4 identifiers with the browser's cryptographic random source.</p><div class="actions"><button onclick="make()">Generate UUID</button><button class="alt" onclick="copy()">Copy</button></div><div id="out" class="output"></div></div></main><script>function make(){out.textContent=crypto.randomUUID()}function copy(){navigator.clipboard.writeText(out.textContent)}make();</script></body></html>
