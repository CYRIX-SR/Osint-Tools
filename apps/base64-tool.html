<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Base64 Lab</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">ENCODING UTILITY</div><h1>Base64 Lab</h1><p class="desc">Encode and decode UTF-8 text using standard Base64.</p><label>Input</label><textarea id="input" rows="9"></textarea><div class="actions"><button onclick="enc()">Encode</button><button class="alt" onclick="dec()">Decode</button></div><div id="out" class="output"></div></div></main><script>function enc(){out.textContent=btoa(unescape(encodeURIComponent(input.value)))}function dec(){try{out.textContent=decodeURIComponent(escape(atob(input.value)))}catch(e){out.textContent="Invalid Base64 input"}}</script></body></html>
