<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hash Lab</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">WEB CRYPTO</div><h1>Hash Lab</h1><p class="desc">Create SHA-256, SHA-384 or SHA-512 hashes locally using Web Crypto.</p><label>Text</label><textarea id="input" rows="7"></textarea><div class="row"><select id="algo"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select><button onclick="hashIt()">Hash</button></div><div id="out" class="output"></div></div></main><script>async function hashIt(){let h=await crypto.subtle.digest(algo.value,new TextEncoder().encode(input.value));out.textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}</script></body></html>
