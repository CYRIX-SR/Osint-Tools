<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JSON Studio</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">DEVELOPER UTILITY</div><h1>JSON Studio</h1><p class="desc">Format, validate and minify JSON without sending it anywhere.</p><label>JSON input</label><textarea id="input" rows="12" placeholder='{"hello":"world"}'></textarea><div class="actions"><button onclick="fmt()">Format</button><button class="alt" onclick="mini()">Minify</button><button class="alt" onclick="copyOut()">Copy</button></div><div id="out" class="output"></div></div></main><script>function get(){return JSON.parse(input.value)}function fmt(){try{out.textContent=JSON.stringify(get(),null,2)}catch(e){out.textContent=e.message}}function mini(){try{out.textContent=JSON.stringify(get())}catch(e){out.textContent=e.message}}function copyOut(){navigator.clipboard.writeText(out.textContent)}</script></body></html>
