<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IPv4 Calculator</title><link rel="stylesheet" href="../tool.css"></head><body><main><a class="back" href="../index.html">← CYRIX TOOLS</a><div class="box"><div class="eyebrow">NETWORKING UTILITY</div><h1>IPv4 Calculator</h1><p class="desc">Calculate IPv4 network information from an address and CIDR prefix. No packets are sent.</p><div class="row"><div><label>IPv4 address</label><input id="ip" value="192.168.10.25"></div><div><label>CIDR prefix</label><input id="cidr" type="number" min="0" max="32" value="24"></div></div><button onclick="calc()">Calculate</button><div id="out" class="result-grid" style="margin-top:18px"></div></div></main><script>function n(s){return s.split(".").reduce((a,x)=>(a<<8)+(+x),0)>>>0}function p(x){return[(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255].join(".")}function calc(){let x=n(ip.value),c=+cidr.value,m=c===0?0:(0xffffffff<<(32-c))>>>0,net=(x&m)>>>0,b=(net|(~m))>>>0,h=c>=31?0:2**(32-c)-2;out.innerHTML=[["Address",ip.value],["Mask",p(m)],["Network",p(net)],["Broadcast",p(b)],["Host count",h],["CIDR","/"+c]].map(([k,v])=>`<div class=result><small>${k}</small><strong>${v}</strong></div>`).join("")}calc();</script></body></html>
